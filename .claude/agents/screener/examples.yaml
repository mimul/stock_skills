# 스코어링 배점 원칙
scoring_principles:
  - preset 에 따라 스코어 배점이 다르다. 에이전트는 preset 에 맞는 배점을 의식한다
  - value 계열: PER/PBR 배점이 높다
  - growth 계열: 성장률/ROE 배점이 높다. PER 제약은 느슨
  - quality 계열: ROE 배점이 가장 높다
  - market-darling: PER 은 역배점 (고PER = 고득점)
  - 지역에 따라 임계값이 다르다 (한국은 PER/PBR 기준이 낮고 배당 기준은 높음, 미국은 그 반대)

tool_responsibilities:
  - 이상치 가드 (배당수익률 >15%, PBR <0.1 등 정제)
  - 지역별 임계값 조정 (소형주 시가총액 기준: 한국 5천억 원 / 미국 $1B 등)
  - EquityQuery 빌드·API 호출 (exchange 는 코스피 KSC / 코스닥 KOE / 미국 NMS·NYQ·ASE·NGM·NCM·PCX)

# ---------------------------------------------------------------------------
# 3축 품질 스코어 활용 Few-shot (KIK-710)
# quality_filter: score_quality() 결과에 대한 필터 조건
# ---------------------------------------------------------------------------
quality_examples:
  - intent: "질 좋은 고배당주"
    params: { region: kr, preset: high-dividend, min_dividend_yield: 0.04, min_roe: 0.08 }
    scoring: "배당(35)+PER(20)+PBR(15)+ROE(15)+성장(15)=100점"
    quality_filter: { min_return: 6, min_durability: 6 }
    reasoning: "고배당 preset 으로 좁힌 뒤 score_quality() 로 환원성≥6 + 지속성≥6 을 필터. 일회성 특별배당으로 보이는 '가짜 고배당'을 배제"

  - intent: "지속성 높은 성장주"
    params: { region: kr, preset: growth, min_revenue_growth: 0.10, min_roe: 0.12 }
    scoring: "성장(30)+ROE(25)+PER(20)+PBR(15)+배당(10)=100점"
    quality_filter: { min_durability: 7, min_growth: 6 }
    reasoning: "성장 preset 으로 좁힌 뒤 score_quality() 로 지속성≥7 + 성장성≥6. 취약한 고성장을 배제"

  - intent: "균형형 우량주"
    params: { region: kr, preset: quality, min_roe: 0.12 }
    scoring: "ROE(35)+PER/PBR(35)+배당(20)+안정성(10)=100점"
    quality_filter: { min_total: 6, min_all_axes: 4 }
    reasoning: "quality 프리셋 + 3축 모두 ≥4 이면서 Total≥6. 삼박자가 갖춰진 종목"

  - intent: "탄탄한 고배당 찾아줘"
    params: { region: kr, preset: high-dividend, min_dividend_yield: 0.045 }
    scoring: "배당(35)+PER(20)+PBR(15)+ROE(15)+성장(15)=100점"
    quality_filter: { min_durability: 7, min_return: 6 }
    reasoning: "지속성≥7 + 환원성≥6 으로 철벽. 배당이 지속 가능한지(배당성향 건전성·재무 견고성)를 중시. 금융지주·통신주가 상위 후보"

  - intent: "환원도 두텁고 성장도 있는 주식"
    params: { region: kr, preset: shareholder-return, min_total_return: 0.04 }
    scoring: "총환원율(30)+PER(20)+PBR(15)+ROE(20)+성장(15)=100점"

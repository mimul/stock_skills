    reasoning: "환원성≥6 + 성장성≥5. 환원 재원이 고갈되지 않는 지속적 환원 기업을 선별"

  - intent: "미국 우량 성장주"
    params: { region: us, preset: growth, min_revenue_growth: 0.12, min_roe: 0.15 }
    scoring: "성장(30)+ROE(25)+PER(20)+PBR(15)+배당(10)=100점"

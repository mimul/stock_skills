# Stock Skills Routing — 에이전트 선택 few-shot
# 모든 경우를 망라할 필요는 없다. 대표 패턴만 있으면 Claude Code 가 유연하게 판단한다.
#
# Output & Visibility v1 (KIK-729) 필드:
#   pattern: A | B | C  (없으면 자동 판정)
#     A = 미니멀 (1-3줄로 끝나는 사실 조회)
#     B = 표준 (단일 에이전트)
#     C = 체인 (연쇄 ≥2 or progressive or routine)
#   header: "🎯 [<agent or chain>] <task>" 형식의 Layer1 헤더
#     생략 시 `[<agent>] <agent.role>` 로 자동 생성
#
# History Check (KIK-740) 필드:
#   history_check: true  → 투자 판단 시 4LLM 병렬로 과거의 역사적 유사 사례를 자동 체크
#     상세는 SKILL.md 의 "History Check" 섹션 참조
#
# Session-Start hard gate (KIK-741) 필드:
#   pf_state_required: true  → orchestrator 는 Agent 기동 전에 reconcile_session_state() 를 반드시 호출
#     morning-summary / routine-daily / routine-weekly / 투자 판단·PF/cash/holdings 언급 패턴에 부여
#     플래그가 없어도 SKILL.md 의 안전측 키워드 판정 (좋은 아침/아침/오늘/현황/PF 등) 으로 발동한다
#     상세는 SKILL.md 의 "Session Start State Reconcile" 섹션 및 "Hook 순서" 참조

agents:
  screener:
    role: 종목 탐색·스크리닝 실행
    triggers: [찾아, 스크리닝, 좋은 주식, 추천, 저평가, 고배당, 테마, 트렌드, 성장주, 품질, 퀄리티, 지속성, 주주환원, 탄탄한, 우량, 소형주, 텐배거, 숨은 종목, 발굴, 무명, ETF, 채권ETF, 섹터ETF, 코스피, 코스닥]
    required_context:
      - key: region
        optional: true
        default: kr
      - key: theme
        optional: true
  analyst:
    role: 종목 분석·밸류에이션 평가 (개별주·ETF)
    triggers: [리포트, 분석, 저평가 정도, 주주환원율, 밸류트랩, 어때]
    required_context:
      - key: symbol
        optional: false
  health-checker:
    role: PF 의 사실·수치를 제시 (판단·추천은 하지 않음)
    triggers: [PF, 포트폴리오, 손익, 헬스체크, 스트레스 테스트, VIX, 금리, 기대수익률, 구조, 쏠림, 시황 체크, 좋은 아침, 아침 요약, 모닝, TODO, 일정, target, 정기 점검, 한번에 체크, 일일 체크, 루틴]
    required_context: []
  researcher:
    role: 뉴스·X 센티먼트·업계/시장 동향·비즈니스 모델 조사
    triggers: [뉴스, 리서치, 심층 조사, 업계, 마켓, 시황, 센티먼트, 비즈니스 모델, 동향, 수급, 외국인, 기관]
    required_context:
      - key: topic_or_symbol
        optional: true
        default: market_overview
  strategist:
    role: 투자 판단·교체 제안·워크플로우 설계·매도 판단
    triggers: [교체, 리밸런싱, 개선, 조정, 플랜, 전략, 어떻게 해야, 갈아타기, 스왑, 매도, 손절, 익절, 처분, 철수, 팔아야, 매도 타이밍]
    required_context:
      - key: target_scope
        optional: true
        default: portfolio
  risk-assessor:
    role: 시장 리스크 상태 판정 (risk-on/neutral/risk-off) + PF 밸런스 목표 제시
    triggers: [리스크 판정, 리스크온, 리스크오프, 눌림목, 과매수, 과매도, 시황 판정]
    required_context: []
  reviewer:
    role: 품질·모순·리스크·반론 체크 (동적 LLM 선택)
    triggers: []  # 자동 삽입: 투자 판단을 동반하는 출력 시
    required_context: []

examples:
  # --- 단일 에이전트 (Pattern B) ---
  - intent: "좋은 주식 있어?"
    agent: screener
    pattern: B
    header: "🎯 [screener] 종목 탐색"

  - intent: "좋은 한국 주식 있어?"
    agent: screener
    pattern: B
    header: "🎯 [screener] 한국 주식 스크리닝"

  - intent: "미국 고배당주 찾아줘"
    agent: screener
    pattern: B
    header: "🎯 [screener] 미국 고배당 스크리닝"

  - intent: "AI 관련 저평가주"
    agent: screener
    pattern: B
    header: "🎯 [screener] AI 관련 저평가 스크리닝"

  - intent: "코스닥 반도체 소형주 찾아줘"
    agent: screener
    pattern: B
    header: "🎯 [screener] 코스닥 반도체 소형주 스크리닝"
    note: "exchange=KOE 로 코스닥만 필터. 코스닥 소형주는 재무 데이터 누락 가능성이 있으니 None 가드"

  # --- 성장주 스크리닝 (리스크 판정 연동·Pattern C) ---
  # risk-on → 트렌드 추종, risk-off → 저평가/역발상, neutral → 보류
  - intent: "성장주 찾아줘"
    agents: [risk-assessor, screener]
    pattern: C
    header: "🎯 [risk-assessor → screener] 리스크 판정 → 스크리닝"
    note: "risk-assessor 의 판정 결과를 screener 에 전달. normal→mode=momentum+sector_signal, risk-off→스크리닝 보류 (사지 않음)"

  - intent: "삼성전자 어때?"
    agent: analyst
    pattern: B
    header: "🎯 [analyst] 삼성전자(005930.KS) 분석"

  - intent: "PF 괜찮아?"
    agent: health-checker
    pattern: B
    header: "🎯 [health-checker] PF 헬스체크"
    pf_state_required: true

  - intent: "스트레스 테스트 해줘"
    agent: health-checker
    pattern: B
    header: "🎯 [health-checker] 스트레스 테스트"
    pf_state_required: true

  # --- Pattern A: 미니멀 (1-3줄로 끝나는 사실 조회) ---
  - intent: "VIX는?"
    agent: health-checker
    pattern: A
    header: "🎯 [health-checker] VIX 확인"

  - intent: "TODO 보여줘"
    agent: health-checker
    pattern: A
    header: "🎯 [health-checker] TODO 리스트"

  - intent: "일정 확인"
    agent: health-checker
    pattern: A
    header: "🎯 [health-checker] 일정 확인"

  # --- 정기 업무: 일일 (KIK-724·Pattern C) ---
  - intent: "정기 점검"
    mode: routine-daily
    agents: [health-checker, researcher]
    pattern: C
    header: "🎯 [routine-daily] 일일 체크"
    pf_state_required: true
    note: "detect_alerts→HC(PF)→HC(시황)+researcher 병렬→타깃 괴리+WL 알림. 3-4분"

  - intent: "한번에 체크"
    mode: routine-daily
    agents: [health-checker, researcher]
    pattern: C
    header: "🎯 [routine-daily] 일일 일괄 체크"
    pf_state_required: true

  - intent: "일일 체크"
    mode: routine-daily
    agents: [health-checker, researcher]
    pattern: C
    header: "🎯 [routine-daily] 일일 체크"
    pf_state_required: true

  - intent: "루틴"
    mode: routine-daily
    agents: [health-checker, researcher]
    pattern: C
    header: "🎯 [routine-daily] 루틴 실행"
    pf_state_required: true

  - intent: "좋은 아침"
    mode: morning-summary
    agent: health-checker
    pattern: A
    header: "🎯 [morning-summary] 아침 요약"
    pf_state_required: true

  - intent: "아침 요약"
    mode: morning-summary
    agent: health-checker
    pattern: A
    header: "🎯 [morning-summary] 아침 요약"
    pf_state_required: true

  - intent: "오늘 상황"
    mode: morning-summary
    agent: health-checker
    pattern: A
    header: "🎯 [morning-summary] 오늘 상황"
    pf_state_required: true

  - intent: "현황 어때?"
    mode: morning-summary
    agent: health-checker
    pattern: A
    header: "🎯 [morning-summary] 현황 확인"
    pf_state_required: true

  # --- 정기 업무: 주간 (KIK-724·Pattern C + 자동 Reviewer) ---
  - intent: "풀 체크"
    mode: routine-weekly
    agents: [health-checker, researcher, risk-assessor, strategist, screener, reviewer]
    pattern: C
    header: "🎯 [routine-weekly] 주간 풀 체크"
    review: true
    pf_state_required: true
    note: "일일+risk-assessor→strategist→조건부 screener→reviewer. 8-13분"

  - intent: "주간 리뷰"
    mode: routine-weekly
    agents: [health-checker, researcher, risk-assessor, strategist, screener, reviewer]
    pattern: C
    header: "🎯 [routine-weekly] 주간 리뷰"
    review: true
    pf_state_required: true

  - intent: "꼼꼼히 보고 싶어"
    mode: routine-weekly
    agents: [health-checker, researcher, risk-assessor, strategist, screener, reviewer]
    pattern: C
    header: "🎯 [routine-weekly] 주간 리뷰"
    review: true
    pf_state_required: true

  - intent: "최신 뉴스 알려줘"
    agent: researcher
    pattern: B
    header: "🎯 [researcher] 최신 뉴스"

  - intent: "반도체 업계 조사해줘"
    agent: researcher
    pattern: B
    header: "🎯 [researcher] 반도체 업계 리서치"

  - intent: "교체 제안해줘"
    agent: strategist
    pattern: B
    header: "🎯 [strategist] 교체 제안"
    review: true
    history_check: true
    pf_state_required: true

  - intent: "플랜 모드로"
    agents: [health-checker, analyst, researcher, strategist]
    pattern: C
    header: "🎯 [HC → analyst → researcher → strategist] PF 확인 → 분석 → 리서치 → 전략 수립"
    progressive: true
    review: true
    history_check: true
    pf_state_required: true

  # --- 복수 에이전트 연쇄 (Pattern C) ---
  - intent: "지금 뜨거운 테마는?"
    agents: [researcher, screener]
    pattern: C
    header: "🎯 [researcher → screener] 테마 리서치 → 스크리닝"

  - intent: "리스크 판정해줘"
    agent: risk-assessor
    pattern: B
    header: "🎯 [risk-assessor] 리스크 판정"

  - intent: "지금 리스크온이야?"
    agent: risk-assessor
    pattern: A
    header: "🎯 [risk-assessor] 리스크 상태 확인"

  - intent: "눌림목 매수 판정"
    agent: risk-assessor
    pattern: B
    header: "🎯 [risk-assessor] 눌림목 매수 판정"

  - intent: "시황 체크"
    agents: [health-checker, researcher]
    pattern: C
    header: "🎯 [HC + researcher] 시황 정량 + 뉴스"

  - intent: "PF 개선하고 싶어"
    agents: [health-checker, strategist]
    pattern: C
    header: "🎯 [HC → strategist] PF 수치 확인 → 개선 제안"
    review: true
    history_check: true
    pf_state_required: true

  # --- 매도 판단 (risk-assessor → health-checker → strategist 3연쇄) ---
  - intent: "이 종목 팔아야 해?"
    agents: [risk-assessor, health-checker, strategist]
    pattern: C
    header: "🎯 [risk → HC → strategist] 리스크 판정 → 수치 확인 → 매도 판단"
    progressive: true
    review: true
    history_check: true
    pf_state_required: true
    note: "risk-assessor 로 시장 리스크 판정→health-checker 로 수치 사실→strategist 로 check_exit_rule 대조+What-If 비교"

  - intent: "손절해야 해?"
    agents: [risk-assessor, health-checker, strategist]
    pattern: C
    header: "🎯 [risk → HC → strategist] 리스크 판정 → 수치 확인 → 손절 판단"
    progressive: true
    review: true
    history_check: true
    pf_state_required: true

  - intent: "익절해야 해?"
    agents: [risk-assessor, health-checker, strategist]
    pattern: C
    header: "🎯 [risk → HC → strategist] 리스크 판정 → 수치 확인 → 익절 판단"
    progressive: true
    review: true
    history_check: true
    pf_state_required: true

  - intent: "리스크 확인하고 대체 종목 찾아줘"
    agents: [health-checker, screener]
    pattern: C
    header: "🎯 [HC → screener] 리스크 확인 → 대체 후보 탐색"
    review: true
    history_check: true
    pf_state_required: true

  - intent: "반도체 조사해서 유망 종목 찾아줘"
    agents: [researcher, screener]
    pattern: C
    header: "🎯 [researcher → screener] 업계 리서치 → 종목 탐색"

  - intent: "삼성전자 조사하고 메모해줘"
    agent: analyst
    pattern: B
    header: "🎯 [analyst] 삼성전자 조사+메모"

  # --- 기록계 (에이전트 불필요, 오케스트레이터가 직접 실행·Pattern A) ---
  - intent: "메모해줘"
    action: direct
    operation: note_save
    pattern: A
    header: "🎯 [direct] 메모 저장"

  - intent: "배운 점 기록"
    action: direct
    operation: note_save
    pattern: A
    header: "🎯 [direct] 배운 점 기록"

  - intent: "테제 기록"
    action: direct
    operation: note_save
    pattern: A
    header: "🎯 [direct] 테제 기록"

  - intent: "관심종목에 넣어줘"
    action: direct
    operation: watchlist_add
    pattern: A
    header: "🎯 [direct] 관심종목 추가"

  - intent: "관심종목 보여줘"
    action: direct
    operation: watchlist_list
    pattern: A
    header: "🎯 [direct] 관심종목 표시"

  - intent: "관심종목에서 빼줘"
    action: direct
    operation: watchlist_remove
    pattern: A
    header: "🎯 [direct] 관심종목 삭제"

  - intent: "삼성전자 10주 샀어"
    action: direct
    operation: portfolio_buy
    pattern: A
    header: "🎯 [direct] PF 매수 기록"

  - intent: "AAPL 5주 팔았어"
    action: direct
    operation: portfolio_sell
    pattern: A
    header: "🎯 [direct] PF 매도 기록"

  - intent: "메모 목록"
    action: direct
    operation: note_list
    pattern: A
    header: "🎯 [direct] 메모 목록"

  - intent: "메모 삭제"
    action: direct
    operation: note_delete
    pattern: A
    header: "🎯 [direct] 메모 삭제"

  - intent: "현금은 ○○원"
    action: direct
    operation: cash_update
    pattern: A
    header: "🎯 [direct] 현금 잔고 업데이트"

  - intent: "현금 잔고"
    action: direct
    operation: cash_update
    pattern: A
    header: "🎯 [direct] 현금 잔고 표시"

  - intent: "달러는 $○○"
    action: direct
    operation: cash_update
    pattern: A
    header: "🎯 [direct] USD 잔고 업데이트"

  - intent: "sync 해줘"
    action: direct
    operation: data_sync
    pattern: A
    header: "🎯 [direct] GraphRAG 동기화"

  - intent: "데이터 동기화해줘"
    action: direct
    operation: data_sync
    pattern: A
    header: "🎯 [direct] 데이터 동기화"

  - intent: "GraphRAG와 동기화"
    action: direct
    operation: data_sync
    pattern: A
    header: "🎯 [direct] GraphRAG 동기화"

  - intent: "데이터 정합성 체크"
    action: direct
    operation: data_sync
    pattern: A
    header: "🎯 [direct] 정합성 체크"

context_rules:
  - 직전 종목이 생략되면 보완한다
  - 직전 스크리닝 결과의 "N위 종목" 은 자동으로 해석한다
  - 직전 health 결과의 주의 종목 (RSI 이상치·큰 손실 등) 은 자동으로 이어받는다

ambiguity:
  strategy: ask  # 복수 에이전트가 같은 점수면 짧게 선택지를 제시
